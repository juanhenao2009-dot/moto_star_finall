<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta - MOTOSTAR</title>
    <link rel="icon" href="img/logo.svg" type="image/svg+xml">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <main class="login-page">
        <div class="login-card wide">
            <a class="logo" href="index.html"><i class="fa-solid fa-motorcycle"></i> MOTOSTAR</a>
            <p class="login-sub">Crea tu cuenta de usuario para registrar tu moto</p>

            <form id="registerForm" novalidate>
                <div class="login-error" id="regError"></div>
                <div class="login-ok" id="regOk"></div>
                <div class="form-group">
                    <label for="nombre">Nombre completo</label>
                    <input type="text" id="nombre" class="form-input" placeholder="Ej: Carlos Ramírez" autocomplete="name">
                </div>
                <div class="form-two">
                    <div class="form-group">
                        <label for="email">Correo electrónico</label>
                        <input type="email" id="email" class="form-input" placeholder="tucorreo@ejemplo.com" autocomplete="email">
                    </div>
                    <div class="form-group">
                        <label for="telefono">Teléfono (opcional)</label>
                        <input type="tel" id="telefono" class="form-input" placeholder="3001234567" autocomplete="tel">
                    </div>
                </div>
                <div class="form-two">
                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" class="form-input" placeholder="Mínimo 6 caracteres" autocomplete="new-password">
                    </div>
                    <div class="form-group">
                        <label for="password2">Confirmar contraseña</label>
                        <input type="password" id="password2" class="form-input" placeholder="Repite la contraseña" autocomplete="new-password">
                    </div>
                </div>
                <p class="hint">Las cuentas de Mecánico y Administrador las crea un administrador desde su panel.</p>
                <button type="submit" class="btn-login">CREAR CUENTA</button>
            </form>

            <p class="back-link" style="margin-top:1rem">¿Ya tienes cuenta? <a href="login.html" style="color:#4d7c0f;font-weight:700">Iniciar sesión</a></p>
            <a class="back-link" href="index.html"><i class="fa-solid fa-arrow-left"></i> Volver al inicio</a>
        </div>
    </main>

    <script src="js/auth.js"></script>
    <script src="js/register.js"></script>
</body>
</html>
